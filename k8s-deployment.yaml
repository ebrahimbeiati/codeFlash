apiVersion: v1
kind: Namespace
metadata:
  name: codeflash-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeflash-app
  namespace: codeflash-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codeflash
  template:
    metadata:
      labels:
        app: codeflash
    spec:
      containers:
      - name: codeflash
        image: codeflash-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: codeflash-service
  namespace: codeflash-dev
spec:
  selector:
    app: codeflash
  ports:
  - port: 3000
    targetPort: 3000
  type: NodePort 